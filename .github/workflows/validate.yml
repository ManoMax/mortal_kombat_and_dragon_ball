name: Prototype validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install asset tools
        run: python3 -m pip install -r requirements-assets.txt
      - name: Rebuild original sprites reproducibly
        run: |
          python3 scripts/build_characters.py
          python3 scripts/build_arena.py
          python3 scripts/build_interface.py
          git diff --exit-code -- engine/chars/goku engine/chars/vegeta engine/stages/obsidian.def engine/stages/obsidian.sff engine/data/fight.def
      - name: Validate sprite geometry and pinned engine
        run: |
          python3 tests/validate.py
          python3 -O tests/validate.py
      - name: Reject invalid test evidence
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
